name: Setup Pentagon favicon and social preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/brand-meta-setup.yml

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pillow cairosvg

      - name: Generate favicon and preview metadata
        run: python .github/scripts/setup_brand_meta.py

      - name: Commit generated assets and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Set Pentagon favicon and social preview"
          git push
