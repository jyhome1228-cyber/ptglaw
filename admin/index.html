<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>펜타곤 관리자 | 콘텐츠 관리</title><link rel="icon" href="../assets/images/favicon.svg"><link rel="stylesheet" href="./firebase-admin.css?v=20261014-1"></head><body>
<div class="admin-layout"><aside class="sidebar"><a href="../"><img src="../assets/images/logo.svg" alt="펜타곤"></a><p>CONTENT MANAGEMENT</p><nav><button class="active" data-view="news">뉴스 관리</button><button data-view="cases">업무사례 관리</button><a href="../newsroom/" target="_blank" rel="noopener">뉴스룸 열기 ↗</a><a href="../cases/" target="_blank" rel="noopener">업무사례 열기 ↗</a></nav><div class="account"><span id="authName">로그인 필요</span><button id="logout" hidden>로그아웃</button></div></aside>
<main class="content"><header><div><span class="eyebrow">PENTAGON / ADMIN</span><h1>콘텐츠 관리</h1><p>뉴스와 업무사례를 작성하고 공개 상태를 관리합니다.</p></div><span id="connection">데이터베이스 연결 중</span></header>
<section id="loginPanel" class="panel login"><h2>관리자 로그인</h2><p>등록된 관리자 계정으로 로그인하세요.</p><form id="loginForm"><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">로그인</button></form><p class="muted">관리자 권한이 등록된 계정만 이용할 수 있습니다.</p></section>
<div id="manager" hidden><div class="notice">기존 게시물은 유지되며, 새로 등록한 콘텐츠는 공개 설정에 따라 홈페이지에 표시됩니다.</div>
<section id="newsSection"><div class="panel"><h2 id="newsFormTitle">뉴스 등록</h2><form id="newsForm"><div class="fields"><label>제목 *<input name="title" required></label><label>게시일 *<input name="date" type="date" required></label><label>언론사<input name="source"></label><label>분류<select name="category"><option value="firm">펜타곤 소식</option><option value="interview">인터뷰</option><option value="column">기고</option><option value="activity">법조 활동</option><option value="broadcast">방송</option></select></label><label class="wide">기사 원문 URL *<input name="url" type="url" placeholder="https://..." required></label><label class="wide">대표 이미지 URL<input name="image" type="url" placeholder="https://..."></label><label class="wide">요약<textarea name="summary" rows="4"></textarea></label><label>공개 상태<select name="status"><option value="draft">임시저장</option><option value="published">즉시 공개</option></select></label></div><div class="actions"><button class="primary" type="submit">저장하기</button><button type="button" data-reset="news">새 글 작성</button></div></form></div></section>
<section id="casesSection" hidden><div class="panel"><h2 id="casesFormTitle">업무사례 등록</h2><form id="casesForm"><div class="fields"><label class="wide">사례 제목 *<input name="title" required></label><label class="wide">요약 *<textarea name="summary" rows="3" required></textarea></label><label>분야<select name="category"><option value="criminal">형사</option><option value="tax">조세·세무</option><option value="civil">민사</option><option value="family">가사·상속</option><option value="corporate">기업</option><option value="realestate">부동산·건설</option><option value="ip">지식재산</option></select></label><label>공개 상태<select name="status"><option value="draft">임시저장</option><option value="published">즉시 공개</option></select></label><fieldset class="wide"><legend>담당 전문가 (복수 선택 가능)</legend><label><input type="checkbox" name="experts" value="채용현"> 채용현</label><label><input type="checkbox" name="experts" value="강건"> 강건</label><label><input type="checkbox" name="experts" value="전승환"> 전승환</label><label><input type="checkbox" name="experts" value="김지수"> 김지수</label></fieldset><label class="wide">사건 개요<textarea name="overview" rows="5"></textarea></label><label class="wide">대응 및 전략<textarea name="strategy" rows="5"></textarea></label><label class="wide">결과<textarea name="resultBody" rows="4"></textarea></label><label class="wide">결과 요약<input name="result"></label><label class="wide">시사점<textarea name="point" rows="4"></textarea></label><label class="wide">태그 (쉼표로 구분)<input name="tags"></label></div><div class="actions"><button class="primary" type="submit">저장하기</button><button type="button" data-reset="cases">새 글 작성</button></div></form></div></section>
<section class="panel"><div class="list-head"><h2 id="listTitle">등록된 뉴스</h2><button id="reload">새로고침</button></div><div id="list">게시물을 불러오는 중입니다.</div></section>
</div><p id="status" role="status" aria-live="polite"></p></main></div><script type="module" src="./firebase-admin.js?v=20261014-2"></script></body></html>
