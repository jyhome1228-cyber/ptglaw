<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>펜타곤 관리자 | 운영 관리</title><link rel="icon" href="../assets/images/favicon.svg"><link rel="stylesheet" href="./firebase-admin.css?v=20261023-summary-redesign"><style>.ops-stat-link{cursor:pointer;text-align:left;font:inherit}.news-image-preview{margin-top:9px;padding:12px;border:1px solid #e5e7eb;border-radius:9px;color:#62676d;font-size:13px}.news-image-preview img{display:block;max-width:240px;max-height:160px;object-fit:contain}.news-image-preview.is-error{color:#ba4d0a}</style><style>.ptg-live-notice{position:fixed;right:18px;top:18px;z-index:11000;max-width:min(390px,calc(100vw - 36px));padding:17px 20px;background:#fff;border:1px solid #e4e4e4;border-left:4px solid #e97920;box-shadow:0 12px 40px #0002;border-radius:12px;color:#202020}.ptg-live-notice[hidden]{display:none}.ptg-live-notice button{margin-top:10px;padding:9px 13px;border:0;border-radius:8px;background:#181818;color:white;cursor:pointer}.ptg-inquiry-count{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:18px;background:#ed741a;color:white;font-size:11px}.ptg-inquiry-count[hidden]{display:none}#newsUploadStatus{display:block;margin:7px 0;color:#616161}</style></head><body class="admin-login-mode">
<div class="admin-auth-shell" id="loginShell"><div class="admin-auth-card"><img src="../assets/images/logo.svg" alt="펜타곤" class="admin-auth-logo"><h1>관리자 로그인</h1><form id="loginForm"><label>이메일<input name="email" type="email" autocomplete="username" required></label><div class="auth-password-group"><label for="adminPassword">비밀번호</label><div class="password-field"><input id="adminPassword" name="password" type="password" autocomplete="current-password" required><button type="button" id="togglePassword" aria-label="비밀번호 표시" aria-pressed="false"><svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/></svg><svg id="eyeClosed" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18M10.6 6.1A11 11 0 0 1 12 6c6.5 0 10 6 10 6a16.2 16.2 0 0 1-3.3 3.8M6.3 6.3C3.5 8 2 12 2 12s3.5 6 10 6c1.2 0 2.3-.2 3.3-.6"/><path d="M10 10a3 3 0 0 0 4 4"/></svg></button></div></div><label class="remember-id" for="rememberAdminEmail"><input type="checkbox" id="rememberAdminEmail"><span>아이디 기억하기</span></label><button class="primary" type="submit">로그인</button></form><p id="status" role="status" aria-live="polite"></p></div></div>
<div class="admin-layout" id="adminApp" hidden><aside class="sidebar"><a href="../"><img src="../assets/images/logo.svg" alt="펜타곤"></a><p>CONTENT MANAGEMENT</p><nav><button class="active" data-view="dashboard">대시보드</button><button data-view="visitors">방문자</button><button data-view="seo">SEO·메타정보</button><button data-view="calculators">계산기 현황</button><button data-view="inquiries">문의 관리</button><button data-view="news">뉴스 관리</button><button data-view="cases">업무사례 관리</button><a href="../newsroom/" target="_blank" rel="noopener">뉴스룸 열기 ↗</a><a href="../cases/" target="_blank" rel="noopener">업무사례 열기 ↗</a></nav><div class="account"><span id="authName">로그인 필요</span><button id="logout" hidden>로그아웃</button></div></aside>
<main class="content"><header><div><span class="eyebrow">PENTAGON / ADMIN</span><h1>운영 관리</h1><p>문의 응대와 콘텐츠 운영 현황을 한 화면에서 관리합니다.</p></div><span id="connection">데이터베이스 연결 중</span></header>

<div id="manager" hidden><section id="opsSection"></section>
<section id="newsSection" hidden><div class="panel"><h2 id="newsFormTitle">뉴스 등록</h2><form id="newsForm"><div class="fields"><label>제목 *<input name="title" required></label><label>게시일 *<input name="date" type="date" required></label><label>언론사<input name="source"></label><label>분류<select name="category"><option value="firm">펜타곤 소식</option><option value="interview">인터뷰</option><option value="column">기고</option><option value="activity">법조 활동</option><option value="broadcast">방송</option></select></label><label class="wide">기사 원문 URL *<input name="url" type="url" placeholder="https://..." required></label><label class="wide">대표 이미지 업로드<input id="newsImageFile" type="file" accept="image/jpeg,image/png,image/webp"><small id="newsUploadStatus">JPG·PNG·WebP, 최대 5MB. 업로드가 어려운 경우 아래 URL을 사용할 수 있습니다.</small><span>이미지 URL (선택)</span><input name="image" type="url" placeholder="https://example.com/photo.jpg"><small>기사 주소가 아닌 이미지 파일 주소(.jpg, .png, .webp 등)를 등록하세요. 주소 확인 후 이미지를 미리 볼 수 있습니다.</small><div id="newsImagePreview" class="news-image-preview" aria-live="polite">등록된 이미지가 없습니다. 뉴스룸에는 기본 카드가 표시됩니다.</div></label><label class="wide">요약<textarea name="summary" rows="4"></textarea></label><label>공개 상태<select name="status"><option value="draft">임시저장</option><option value="published">즉시 공개</option></select></label></div><div class="actions"><button class="primary" type="submit">저장하기</button><button type="button" data-reset="news">새 글 작성</button></div></form></div></section>
<section id="casesSection" hidden><div class="panel"><h2 id="casesFormTitle">업무사례 등록</h2><form id="casesForm"><div class="fields"><label class="wide">사례 제목 *<input name="title" required></label><label class="wide">요약 *<textarea name="summary" rows="3" required></textarea></label><label>분야<select name="category"><option value="criminal">형사</option><option value="tax">조세·세무</option><option value="civil">민사</option><option value="family">가사·상속</option><option value="corporate">기업</option><option value="realestate">부동산·건설</option><option value="ip">지식재산</option></select></label><label>공개 상태<select name="status"><option value="draft">임시저장</option><option value="published">즉시 공개</option></select></label><fieldset class="wide"><legend>담당 전문가 (복수 선택 가능)</legend><label><input type="checkbox" name="experts" value="채용현"> 채용현</label><label><input type="checkbox" name="experts" value="강건"> 강건</label><label><input type="checkbox" name="experts" value="전승환"> 전승환</label><label><input type="checkbox" name="experts" value="김지수"> 김지수</label></fieldset><label class="wide">사건 개요<textarea name="overview" rows="5"></textarea></label><label class="wide">대응 및 전략<textarea name="strategy" rows="5"></textarea></label><label class="wide">결과<textarea name="resultBody" rows="4"></textarea></label><label class="wide">결과 요약<input name="result"></label><label class="wide">시사점<textarea name="point" rows="4"></textarea></label><label class="wide">태그 (쉼표로 구분)<input name="tags"></label></div><div class="actions"><button class="primary" type="submit">저장하기</button><button type="button" data-reset="cases">새 글 작성</button></div></form></div></section>
<section class="panel" id="contentListPanel" hidden><div class="list-head"><h2 id="listTitle">등록된 뉴스</h2><button id="reload">새로고침</button></div><div id="list">게시물을 불러오는 중입니다.</div></section>
</div></main></div><script type="module" src="./firebase-admin.js?v=20261023-pending-modal"></script></body></html>
