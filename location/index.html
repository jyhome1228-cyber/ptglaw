<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>오시는 길 | 펜타곤 법률세무회계</title>
  <meta name="description" content="펜타곤 법률세무회계 오시는 길과 주소, 연락처, 주차 안내를 확인하세요.">
  <link rel="canonical" href="https://ptglaw.co.kr/location/">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div data-site-header></div>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <p class="eyebrow">LOCATION</p>
        <h1>오시는 길</h1>
        <p>펜타곤 법률세무회계 사무실 위치와 방문 정보를 안내드립니다.</p>
      </div>
    </section>

    <section class="section ptg-location-page">
      <div class="wrap">
        <div class="ptg-location-photo-placeholder" aria-label="사무실 이미지 영역">
          <span>OFFICE IMAGE</span>
          <small>이미지 추후 적용</small>
        </div>

        <div class="ptg-location-grid">
          <div class="ptg-location-copy">
            <p class="eyebrow">VISIT PENTAGON</p>
            <h2>오시는 길</h2>

            <dl class="ptg-location-info">
              <div>
                <dt>주소</dt>
                <dd>서울특별시 서초구 반포대로30길 32, 트러스트힐 3층</dd>
              </div>
              <div>
                <dt>전화</dt>
                <dd><a href="tel:0264475599">02-6447-5599</a></dd>
              </div>
              <div>
                <dt>건물</dt>
                <dd>주차타워 이용 가능<br><span>주차타워 이용이 어려운 경우 인근 민영주차장을 이용해 주세요.</span></dd>
              </div>
            </dl>

            <div class="ptg-location-parking">
              <p class="ptg-location-subtitle">주차 안내</p>
              <ol>
                <li>서초현대민영주차장 2층 <span>(2시간 주차권 발급)</span></li>
                <li>GS 타임즈 서초동 제1주차장</li>
              </ol>
            </div>

            <div class="ptg-location-buttons" aria-label="지도 바로가기">
              <span class="ptg-location-button is-pending">네이버 지도</span>
              <span class="ptg-location-button is-pending">카카오맵</span>
            </div>
          </div>

          <div class="ptg-location-map-placeholder" aria-label="약도 이미지 영역">
            <span>LOCATION MAP</span>
            <small>약도 이미지 추후 적용</small>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
  <script src="../assets/js/app.js"></script>

  <style>
    .ptg-location-page{padding-top:72px}
    .ptg-location-photo-placeholder{min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#f4f4f2;border:1px solid #e7e6e2;color:#999;font-size:12px;letter-spacing:.12em}
    .ptg-location-photo-placeholder small,.ptg-location-map-placeholder small{font-size:11px;letter-spacing:0;color:#aaa}
    .ptg-location-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,.9fr);gap:72px;align-items:start;margin-top:82px}
    .ptg-location-copy .eyebrow{color:#f58220;margin-bottom:18px}
    .ptg-location-copy h2{margin:0 0 34px;font-size:clamp(28px,2.2vw,36px);line-height:1.25;font-weight:650;letter-spacing:-.045em;color:#f58220}
    .ptg-location-info{margin:0;padding:0;border-top:1px solid #deddd9}
    .ptg-location-info>div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:18px;padding:15px 0;border-bottom:1px solid #ecebe7}
    .ptg-location-info dt{font-size:14px;font-weight:700;color:#111}
    .ptg-location-info dd{margin:0;font-size:15px;line-height:1.7;color:#444}
    .ptg-location-info dd span{color:#777;font-size:13px}
    .ptg-location-parking{margin-top:26px}
    .ptg-location-subtitle{margin:0 0 12px;font-size:13px;font-weight:700;color:#111}
    .ptg-location-parking ol{margin:0;padding-left:20px;color:#666;font-size:14px;line-height:1.9}
    .ptg-location-parking li span{color:#888}
    .ptg-location-buttons{display:flex;gap:12px;margin-top:34px}
    .ptg-location-button{display:inline-flex;align-items:center;justify-content:center;min-width:180px;min-height:48px;padding:0 22px;border:1px solid #d7d6d2;background:#fff;color:#222;font-size:13px;font-weight:650}
    .ptg-location-button.is-pending{cursor:default}
    .ptg-location-map-placeholder{min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#fafafa;border:1px solid #e7e6e2;color:#aaa;font-size:12px;letter-spacing:.12em}
    @media(max-width:980px){.ptg-location-grid{grid-template-columns:1fr;gap:48px}.ptg-location-photo-placeholder{min-height:360px}.ptg-location-map-placeholder{min-height:340px}}
    @media(max-width:640px){.ptg-location-page{padding-top:52px}.ptg-location-photo-placeholder{min-height:250px}.ptg-location-grid{margin-top:54px;gap:36px}.ptg-location-info>div{grid-template-columns:56px minmax(0,1fr);gap:12px}.ptg-location-info dd{font-size:14px}.ptg-location-buttons{display:grid;grid-template-columns:1fr 1fr}.ptg-location-button{min-width:0;width:100%;padding:0 12px}.ptg-location-map-placeholder{min-height:270px}}
  </style>
</body>
</html>
