  function makeCard(item,index){var article=document.createElement('article');article.className='ptg-news-card';article.setAttribute('data-news-item','');article.setAttribute('data-news-category',item.category);var f=FALLBACK_COPY[item.category]||FALLBACK_COPY.activity,isoDate=normalizedDate(item.date),imageUrl=encodeMicrolink(item.url,'image'),shotUrl=encodeMicrolink(item.url,'screenshot'),loading=index<6?'eager':'lazy',priority=index<3?'high':'auto';article.innerHTML='<a href="'+escapeHTML(item.url)+'" rel="noopener noreferrer" target="_blank"><div class="ptg-news-card__visual '+visualClass(item)+' has-preview"><div class="ptg-news-card__fallback"><span class="ptg-news-card__source">'+escapeHTML(item.source)+'</span><div class="ptg-news-card__visual-copy"><strong>'+escapeHTML(f[0])+'</strong><em>'+escapeHTML(f[1])+'</em></div><time datetime="'+isoDate+'">'+escapeHTML(item.date)+'</time></div><img alt="'+escapeHTML(item.title)+'" class="ptg-news-card__preview" data-screenshot="'+escapeHTML(shotUrl)+'" data-stage="image" decoding="async" fetchpriority="'+priority+'" loading="'+loading+'" src="'+escapeHTML(imageUrl)+'"><span class="ptg-news-card__preview-badge">'+escapeHTML(item.source)+'</span><time class="ptg-news-card__preview-date" datetime="'+isoDate+'">'+escapeHTML(item.date)+'</time></div><div class="ptg-news-card__body"><div class="ptg-news-card__meta"><span>'+(CATEGORY_LABELS[item.category]||'법조 활동')+'</span><time datetime="'+isoDate+'">'+escapeHTML(item.date)+'</time></div><h3>'+escapeHTML(item.title)+'</h3><p>'+escapeHTML(CATEGORY_COPY[item.category]||CATEGORY_COPY.activity)+'</p><span class="ptg-news-card__link">기사 원문 보기</span></div></a>';var img=article.querySelector('.ptg-news-card__preview'),visual=article.querySelector('.ptg-news-card__visual');img.addEventListener('load',function(){visual.classList.add('is-loaded');visual.classList.remove('is-fallback')});img.addEventListener('error',function(){if(img.dataset.stage==='image'){img.dataset.stage='screenshot';img.src=img.dataset.screenshot}else{img.style.display='none';visual.classList.remove('is-loaded');visual.classList.add('is-fallback')}});return article}
  var sortedData=NEWS_DATA.map(function(item,i){item.__index=i;return item}).sort(function(a,b){var d=normalizedDate(b.date).localeCompare(normalizedDate(a.date));return d||a.__index-b.__index});
  var cards=sortedData.map(makeCard),fragment=document.createDocumentFragment();cards.forEach(function(card){fragment.appendChild(card)});grid.appendChild(fragment);
  function matchesFilter(card,filter){return filter==='all'||card.getAttribute('data-news-category')===filter}
  function render(){var matched=cards.filter(function(card){return matchesFilter(card,currentFilter)});cards.forEach(function(card){card.classList.add('is-hidden')});matched.slice(0,visibleLimit).forEach(function(card){card.classList.remove('is-hidden')});moreButton.hidden=matched.length<=visibleLimit}
  buttons.forEach(function(button){button.addEventListener('click',function(){currentFilter=button.getAttribute('data-news-filter')||'all';visibleLimit=9;buttons.forEach(function(btn){var active=btn===button;btn.classList.toggle('is-active',active);btn.setAttribute('aria-pressed',active?'true':'false')});render()})});
  moreButton.addEventListener('click',function(){visibleLimit+=6;render()});render();
  var ld={'@context':'https://schema.org','@type':'ItemList','name':'펜타곤 뉴스룸','itemListElement':sortedData.map(function(item,index){return{'@type':'ListItem','position':index+1,'url':item.url,'name':item.title}})};var ldScript=document.createElement('script');ldScript.type='application/ld+json';ldScript.text=JSON.stringify(ld);document.head.appendChild(ldScript)
})();
</script>
