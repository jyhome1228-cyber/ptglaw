<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부가세 계산기 | 펜타곤 법률세무회계</title><meta name="description" content="공급가액과 부가세 포함 금액을 기준으로 부가가치세를 계산하세요."><link rel="canonical" href="https://ptglaw.co.kr/tools/vat/"><link rel="stylesheet" href="../../assets/css/style.css"><link rel="stylesheet" href="../tools.css"></head><body><div data-site-header></div><main><section class="ptg-tools-page"><div class="ptg-tools-shell"><header class="ptg-tools-head"><h1>부가세 계산기</h1><p>공급가액 또는 부가세 포함 금액을 입력하면 공급가액, 부가가치세 10%, 최종 합계액을 바로 확인할 수 있습니다.</p></header><div class="ptg-calc-wrap" data-vat-calculator><section class="ptg-calc-panel"><div class="ptg-calc-tabs"><button class="is-active" type="button" data-mode="supply">공급가액 기준</button><button type="button" data-mode="total">포함금액 역산</button></div><div class="ptg-calc-field"><label data-input-label>공급가액</label><div class="ptg-calc-input"><input type="text" inputmode="numeric" data-amount value="1000000" aria-label="계산 금액"><span>원</span></div></div><div class="ptg-calc-result"><div class="ptg-calc-row"><span>공급가액</span><strong data-supply>0원</strong></div><div class="ptg-calc-row"><span>부가가치세 10%</span><strong data-vat>0원</strong></div><div class="ptg-calc-row is-total"><span>합계금액</span><strong data-total>0원</strong></div></div></section><aside class="ptg-calc-note"><h3>계산 안내</h3><p>일반적인 부가가치세율 10%를 기준으로 계산합니다.</p><p>면세·영세율·간이과세 등 실제 거래 유형에 따라 부가세 처리 방식이 달라질 수 있습니다.</p></aside></div></div></section></main><div data-site-footer></div><script src="../calculators.js"></script><script src="../../assets/js/app.js"></script></body></html>
