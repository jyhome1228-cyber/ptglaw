<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3.3% 원천징수 계산기 | 펜타곤 법률세무회계</title><meta name="description" content="3.3% 원천징수액과 실수령액을 빠르게 계산하세요."><link rel="canonical" href="https://ptglaw.co.kr/tools/withholding/"><link rel="stylesheet" href="../../assets/css/style.css"><link rel="stylesheet" href="../tools.css"></head><body><div data-site-header></div><main><section class="ptg-tools-page"><div class="ptg-tools-shell"><header class="ptg-tools-head"><h1>3.3% 원천징수 계산기</h1><p>사업소득 지급 시 일반적으로 적용되는 소득세 3%와 지방소득세 0.3%를 기준으로 예상 원천징수액과 실수령액을 계산합니다.</p></header><div class="ptg-calc-wrap" data-withholding-calculator><section class="ptg-calc-panel"><div class="ptg-calc-tabs"><button class="is-active" type="button" data-mode="gross">지급금액으로 계산</button><button type="button" data-mode="net">실수령액으로 역산</button></div><div class="ptg-calc-field"><label data-input-label>지급 예정 금액</label><div class="ptg-calc-input"><input type="text" inputmode="numeric" data-amount value="1000000" aria-label="계산 금액"><span>원</span></div></div><div class="ptg-calc-result"><div class="ptg-calc-row"><span>소득세 3%</span><strong data-tax>0원</strong></div><div class="ptg-calc-row"><span>지방소득세 0.3%</span><strong data-local-tax>0원</strong></div><div class="ptg-calc-row"><span>총 원천징수액</span><strong data-withheld>0원</strong></div><div class="ptg-calc-row is-total"><span>예상 실수령액</span><strong data-net>0원</strong></div></div></section><aside class="ptg-calc-note"><h3>계산 안내</h3><p>원천징수 세율 3.3%를 단순 계산한 참고값입니다.</p><p>실제 지급 성격, 소득 구분, 필요경비, 신고 방식 등에 따라 세무처리가 달라질 수 있습니다.</p></aside></div></div></section></main><div data-site-footer></div><script src="../calculators.js"></script><script src="../../assets/js/app.js"></script></body></html>
