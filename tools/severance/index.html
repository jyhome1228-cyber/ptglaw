<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>퇴직금 계산기 | 펜타곤 법률세무회계</title><meta name="description" content="입사일, 퇴직일, 퇴직 전 3개월 임금총액을 기준으로 예상 퇴직금을 간편 계산합니다."><link rel="canonical" href="https://ptglaw.co.kr/tools/severance/"><link rel="stylesheet" href="../../assets/css/style.css"><link rel="stylesheet" href="../tools.css?v=20260913-1110"></head><body><div data-site-header></div><main><section class="ptg-tools-page"><div class="ptg-tools-shell"><header class="ptg-tools-head"><h1>퇴직금 계산기</h1><p>입사일과 퇴직일, 퇴직 전 3개월 임금총액을 기준으로 1일 평균임금과 예상 법정 퇴직금을 계산합니다.</p></header><div class="ptg-calc-wrap" data-severance-calculator><section class="ptg-calc-panel"><div class="ptg-calc-fields"><div class="ptg-calc-field"><label>입사일</label><input class="ptg-calc-control" type="date" data-start-date></div><div class="ptg-calc-field"><label>퇴직일</label><input class="ptg-calc-control" type="date" data-end-date></div><div class="ptg-calc-field"><label>퇴직 전 3개월 임금총액</label><div class="ptg-calc-input"><input type="text" inputmode="numeric" data-three-month-wages value="12000000" aria-label="퇴직 전 3개월 임금총액"><span>원</span></div></div><div class="ptg-calc-field"><label>퇴직 전 3개월 총일수</label><div class="ptg-calc-input"><input type="number" min="1" max="93" data-average-days value="92" aria-label="퇴직 전 3개월 총일수"><span>일</span></div></div></div><div class="ptg-calc-result"><div class="ptg-calc-row"><span>계속근로일수</span><strong data-service-days>0일</strong></div><div class="ptg-calc-row"><span>1일 평균임금</span><strong data-average-wage>0원</strong></div><div class="ptg-calc-row is-total"><span>예상 퇴직금</span><strong data-severance-total>0원</strong></div><p class="ptg-calc-status" data-severance-status></p></div></section><aside class="ptg-calc-note"><h3>계산 안내</h3><p>퇴직금은 1일 평균임금 × 30일 × 계속근로일수 ÷ 365의 기본 산식을 적용합니다.</p><p>평균임금은 원칙적으로 퇴직 전 3개월의 임금총액을 해당 기간 총일수로 나누어 계산합니다.</p><p>상여금, 연차수당, 휴직기간, 통상임금 비교, 주 15시간 미만 여부 등에 따라 실제 금액이 달라질 수 있습니다.</p></aside></div></div></section></main><div data-site-footer></div><script src="../calculators.js"></script><script src="../../assets/js/app.js?v=20260913-1105"></script></body></html>
