<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>법인등기 비용 계산기 | 펜타곤 법률세무회계</title><meta name="description" content="자본금과 대도시 중과 여부를 기준으로 법인 설립 등기의 등록면허세와 지방교육세를 간편 계산합니다."><link rel="canonical" href="https://ptglaw.co.kr/tools/corporate-registration/"><link rel="stylesheet" href="../../assets/css/style.css"><link rel="stylesheet" href="../tools.css?v=20260913-1110"></head><body><div data-site-header></div><main><section class="ptg-tools-page"><div class="ptg-tools-shell"><header class="ptg-tools-head"><h1>법인등기 비용 계산기</h1><p>자본금과 대도시 중과 여부를 기준으로 법인 설립 시 발생하는 등록면허세와 지방교육세를 간편하게 계산합니다.</p></header><div class="ptg-calc-wrap" data-corporate-registration-calculator><section class="ptg-calc-panel"><div class="ptg-calc-fields"><div class="ptg-calc-field"><label>자본금</label><div class="ptg-calc-input"><input type="text" inputmode="numeric" data-capital value="100000000" aria-label="자본금"><span>원</span></div></div><div class="ptg-calc-field"><label>설립 지역</label><select class="ptg-calc-select" data-region><option value="normal">일반 지역</option><option value="metro">대도시 중과 대상 가정</option></select></div></div><div class="ptg-calc-result"><div class="ptg-calc-row"><span>예상 등록면허세</span><strong data-registration-tax>0원</strong></div><div class="ptg-calc-row"><span>예상 지방교육세</span><strong data-education-tax>0원</strong></div><div class="ptg-calc-row is-total"><span>예상 세금 합계</span><strong data-public-total>0원</strong></div></div></section><aside class="ptg-calc-note"><h3>계산 안내</h3><p>영리법인 설립의 등록면허세 기본세율 0.4%, 최저세액 112,500원을 기준으로 계산합니다.</p><p>대도시 중과 대상 선택 시 등록면허세를 3배로 계산합니다. 지방교육세는 등록면허세의 20% 기준입니다.</p><p>등기신청수수료, 공증비용, 대행보수, 감면·중과 예외 등은 포함하지 않습니다.</p></aside></div></div></section></main><div data-site-footer></div><script src="../calculators.js"></script><script src="../../assets/js/app.js?v=20260913-1105"></script></body></html>
